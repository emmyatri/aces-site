<svg xmlns="http://www.w3.org/2000/svg" width="10.75in" height="16.03in" viewBox="0 0 1075 1603" font-family="Arial, Helvetica, Liberation Sans, sans-serif">
<title>ACeS Phase 1 architecture (simplified)</title>
<rect x="88" y="8" width="981" height="124" rx="18" fill="#FCF1E1" stroke="#B8862B" stroke-width="4"/>
<circle cx="38" cy="52" r="30" fill="#1D1D1F"/>
<text x="38" y="64" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="118" y="62" font-size="42" font-weight="700" fill="#8A5F12" text-anchor="start">Customer Success asks</text>
<text x="118" y="102" font-size="31" fill="#3C3C43" text-anchor="start">"Build the quarterly review for this client"</text>
<line x1="578.5" y1="132" x2="578.5" y2="162" stroke="#55565A" stroke-width="5"/>
<polygon points="565.5,160 591.5,160 578.5,178" fill="#55565A"/>
<text x="600.5" y="164.0" font-size="24" fill="#3C3C43" text-anchor="start">the request</text>
<rect x="88" y="178" width="981" height="198" rx="18" fill="#E6EEF9" stroke="#2F5BA8" stroke-width="4"/>
<circle cx="38" cy="222" r="30" fill="#1D1D1F"/>
<text x="38" y="234" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="118" y="232" font-size="42" font-weight="700" fill="#24498A" text-anchor="start">Planner</text>
<text x="118" y="266" font-size="24" font-weight="700" letter-spacing="1.5" fill="#24498A" text-anchor="start">AI WITH NO TOOLS</text>
<text x="118" y="306" font-size="31" fill="#3C3C43" text-anchor="start">Turns the request into a fixed form.</text>
<text x="118" y="346" font-size="31" fill="#3C3C43" text-anchor="start">Code refuses anything off the approved list.</text>
<line x1="578.5" y1="376" x2="578.5" y2="406" stroke="#55565A" stroke-width="5"/>
<polygon points="565.5,404 591.5,404 578.5,422" fill="#55565A"/>
<text x="600.5" y="408.0" font-size="24" fill="#3C3C43" text-anchor="start">client and dates only</text>
<rect x="88" y="422" width="981" height="292" rx="18" fill="#E5F2EE" stroke="#2E7D63" stroke-width="4"/>
<circle cx="38" cy="466" r="30" fill="#1D1D1F"/>
<text x="38" y="478" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="118" y="476" font-size="42" font-weight="700" fill="#1F5E4A" text-anchor="start">Collectors</text>
<text x="118" y="510" font-size="24" font-weight="700" letter-spacing="1.5" fill="#1F5E4A" text-anchor="start">PLAIN CODE, NO AI, READ-ONLY</text>
<rect x="118.0" y="530" width="446.5" height="120" rx="12" fill="#FFFFFF" stroke="#2E7D63" stroke-width="3"/>
<text x="140.0" y="574" font-size="36" font-weight="700" fill="#1D1D1F" text-anchor="start">SecOps</text>
<text x="140.0" y="618" font-size="31" fill="#3C3C43" text-anchor="start">alerts, cases, rules</text>
<rect x="592.5" y="530" width="446.5" height="120" rx="12" fill="#FFFFFF" stroke="#2E7D63" stroke-width="3"/>
<text x="614.5" y="574" font-size="36" font-weight="700" fill="#1D1D1F" text-anchor="start">Automox</text>
<text x="614.5" y="618" font-size="31" fill="#3C3C43" text-anchor="start">devices, patches</text>
<text x="118" y="690" font-size="31" font-weight="700" fill="#B3261E" text-anchor="start">No patch, reboot, or script tools exist.</text>
<line x1="578.5" y1="714" x2="578.5" y2="744" stroke="#55565A" stroke-width="5"/>
<polygon points="565.5,742 591.5,742 578.5,760" fill="#55565A"/>
<text x="600.5" y="746.0" font-size="24" fill="#3C3C43" text-anchor="start">rows into BigQuery</text>
<rect x="88" y="760" width="981" height="198" rx="18" fill="#D3EAE3" stroke="#1F5E4E" stroke-width="4"/>
<circle cx="38" cy="804" r="30" fill="#1D1D1F"/>
<text x="38" y="816" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="118" y="814" font-size="42" font-weight="700" fill="#16473B" text-anchor="start">BigQuery match-up</text>
<text x="118" y="848" font-size="24" font-weight="700" letter-spacing="1.5" fill="#16473B" text-anchor="start">SQL, NO AI</text>
<text x="118" y="888" font-size="31" fill="#3C3C43" text-anchor="start">Links the same machine across both systems.</text>
<text x="118" y="928" font-size="31" fill="#3C3C43" text-anchor="start">Fixed rules decide what counts as a finding.</text>
<line x1="578.5" y1="958" x2="578.5" y2="988" stroke="#55565A" stroke-width="5"/>
<polygon points="565.5,986 591.5,986 578.5,1004" fill="#55565A"/>
<text x="600.5" y="990.0" font-size="24" fill="#3C3C43" text-anchor="start">findings only</text>
<rect x="88" y="1004" width="981" height="236" rx="18" fill="#F0E8F7" stroke="#7B4FB0" stroke-width="4"/>
<circle cx="38" cy="1048" r="30" fill="#1D1D1F"/>
<text x="38" y="1060" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="118" y="1058" font-size="42" font-weight="700" fill="#5E3A8A" text-anchor="start">Insight agents</text>
<text x="118" y="1092" font-size="24" font-weight="700" letter-spacing="1.5" fill="#5E3A8A" text-anchor="start">AI WITH NO TOOLS AND NO KEYS</text>
<text x="118" y="1132" font-size="31" fill="#3C3C43" text-anchor="start">Explain each finding and suggest a next step.</text>
<rect x="118" y="1176" width="921" height="58" rx="29" fill="#FFFFFF" stroke="#7B4FB0" stroke-width="3"/>
<text x="578.5" y="1216" font-size="28" font-weight="700" fill="#5E3A8A" text-anchor="middle">Evidence gate: every statement must match a finding</text>
<line x1="578.5" y1="1240" x2="578.5" y2="1270" stroke="#55565A" stroke-width="5"/>
<polygon points="565.5,1268 591.5,1268 578.5,1286" fill="#55565A"/>
<text x="600.5" y="1272.0" font-size="24" fill="#3C3C43" text-anchor="start">draft report</text>
<rect x="88" y="1286" width="981" height="164" rx="18" fill="#FCF1E1" stroke="#B8862B" stroke-width="4"/>
<circle cx="38" cy="1330" r="30" fill="#1D1D1F"/>
<text x="38" y="1342" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="118" y="1340" font-size="42" font-weight="700" fill="#8A5F12" text-anchor="start">A person approves it</text>
<text x="118" y="1380" font-size="31" fill="#3C3C43" text-anchor="start">Nothing is released without human review.</text>
<text x="118" y="1420" font-size="31" fill="#3C3C43" text-anchor="start">ACeS never contacts or changes a client system.</text>
<rect x="0" y="1476" width="1075" height="126" rx="18" fill="#FFC000" stroke="#FFC000" stroke-width="0"/>
<text x="537.5" y="1532" font-size="40" font-weight="700" fill="#1D1D1F" text-anchor="middle">Data never flows through the AI.</text>
<text x="537.5" y="1578" font-size="31" fill="#1D1D1F" text-anchor="middle">The AI only sees findings that SQL already computed.</text>
</svg>
